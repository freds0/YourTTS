[build-system]
requires = [
    "setuptools>=45.0",
    "wheel",
    "cython>=0.29.30",
    "numpy>=1.22.0",
    "packaging>=23.1",
]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 120
target-version = ['py39', 'py310', 'py311']

[tool.isort]
line_length = 120
profile = "black"
multi_line_output = 3

[tool.flake8]
max-line-length = 120
